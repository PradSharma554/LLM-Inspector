# Pings the collector so Render's free tier doesn't spin the instance down.
#
# NOTE: keeping a free instance permanently warm is a gray area under Render's
# ToS. Delete this file if you'd rather accept ~30-60s cold starts.
#
# Pings /health, NOT /ready. /health deliberately does not touch Postgres:
# Render sleeps on HTTP inactivity and does not care whether a request reached
# the database, so a deep check every ~10 minutes would keep Neon's compute
# awake around the clock and exhaust free-tier CU-hours (~90 of 100 per month).
#
# Required repo settings (Settings > Secrets and variables > Actions):
#   - variable BACKEND_URL   e.g. https://llm-inspector-collector.onrender.com
name: keepalive

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping liveness endpoint
        # --max-time 90: a sleeping Render instance takes ~30-60s to wake.
        # `|| true` so a transient failure doesn't send a red-run notification;
        # a missed ping only costs one cold start.
        run: curl -sS --max-time 90 "${{ vars.BACKEND_URL }}/health" || true
